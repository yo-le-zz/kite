name: build-installer-macos

# Builds the Kite GUI installer for macOS on real Apple hardware/toolchain
# (GitHub-hosted macos runners), since neither `cross` nor `cargo-zigbuild`
# can link this app's AppKit/Metal dependencies -- see the notes at the top
# of installer/build.sh for why.
#
# Trigger manually from the Actions tab, or on a version tag push.
# Produces the same file names as installer/build.sh's own macos-* output
# (kite-installer-<version>-macos-<arch>.tar.gz), ready to attach to the
# same GitHub release as everything else.

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            short: macos-x64
            runner: macos-15-intel   # macos-13 was fully retired Dec 2025
          - target: aarch64-apple-darwin
            short: macos-arm64
            runner: macos-15        # macos-14 entered deprecation July 2026
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          STAGE="$(mktemp -d)/kite-installer-${VERSION}-${{ matrix.short }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/Kite-Installer" "$STAGE/kite-installer"
          [ -f README.md ] && cp README.md "$STAGE/"
          [ -f LICENSE ] && cp LICENSE "$STAGE/"
          mkdir -p "dist/macos/${{ matrix.short }}"
          ARCHIVE="dist/macos/${{ matrix.short }}/kite-installer-${VERSION}-${{ matrix.short }}.tar.gz"
          tar -C "$(dirname "$STAGE")" -czf "$ARCHIVE" "$(basename "$STAGE")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kite-installer-${{ matrix.short }}
          path: installer/${{ env.ARCHIVE }}